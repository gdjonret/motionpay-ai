services:
  - type: web
    name: motionpay-ai-api-gdjonret
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PUBLIC_API_URL
        value: https://motionpay-ai-api-gdjonret.onrender.com
      - key: PUBLIC_APP_URL
        value: https://motionpay-ai-gdjonret.onrender.com
      - key: CORS_ORIGINS
        value: https://motionpay-ai-gdjonret.onrender.com

  - type: web
    name: motionpay-ai-gdjonret
    runtime: static
    buildCommand: cd mobile && npm ci && npx expo export --platform web --output-dir dist
    staticPublishPath: ./mobile/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://motionpay-ai-api-gdjonret.onrender.com
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: EXPO_PUBLIC_AUTH_REDIRECT_URL
        value: https://motionpay-ai-gdjonret.onrender.com/recover
